# Web CRM type checks and unit tests on every web-code change.
# No secrets, no database access: tests/setup/block-live-database.ts fails any
# backend request, so this job never touches the live project.
name: Web CI

on:
  pull_request:
    paths-ignore: ["android/**", ".github/workflows/android-*.yml", "docs/**", "*.md"]
  push:
    branches: [main]
    paths-ignore: ["android/**", ".github/workflows/android-*.yml", "docs/**", "*.md"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          # Caches Bun's global package cache keyed on bun.lock, so repeat
          # runs skip re-downloading dependencies.
          cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Unit tests with coverage
        run: bunx vitest run --coverage
      - name: Coverage summary
        if: always()
        run: |
          mkdir -p coverage
          bun scripts/coverage-summary.ts | tee coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment coverage on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("coverage/summary.md", "utf8");
            const marker = "<!-- web-ci-coverage -->";
            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
            }
