# Web CRM type checks and unit tests on every web-code change.
# No secrets, no database access: tests/setup/block-live-database.ts fails any
# backend request, so this job never touches the live project.
name: Web CI

on:
  pull_request:
    paths-ignore: ["android/**", ".github/workflows/android-*.yml", "docs/**", "*.md"]
  push:
    branches: [main]
    paths-ignore: ["android/**", ".github/workflows/android-*.yml", "docs/**", "*.md"]

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
