name: Web Companion debug APK

on:
  pull_request:
    branches: [main]
    paths:
      - "android/settings.gradle.kts"
      - "android/webcompanion/**"
      - ".github/workflows/webcompanion-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :webcompanion:assembleDebug
          test -s webcompanion/build/outputs/apk/debug/webcompanion-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: winstone-pulse-webcompanion-debug
          path: android/webcompanion/build/outputs/apk/debug/webcompanion-debug.apk
          if-no-files-found: error
          retention-days: 7
